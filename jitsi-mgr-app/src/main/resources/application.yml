spring:
  application:
    name: jitsi-mgr
  
  profiles:
    active: dev
  
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:jitsi_mgr}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/mgr/v1

# JWT Configuration
jwt:
  secret:
    private-key: ${JWT_PRIVATE_KEY:classpath:keys/jwt-private.pem}
    public-key: ${JWT_PUBLIC_KEY:classpath:keys/jwt-public.pem}
  issuer: ${JWT_ISSUER:cloudmeet-mgr}
  audience: ${JWT_AUDIENCE:cloudmeet-client}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:7200}  # 2 hours in seconds
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:2592000}  # 30 days in seconds

# Rate Limiting
rate-limit:
  login:
    max-attempts: ${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
    window-seconds: ${RATE_LIMIT_LOGIN_WINDOW:900}  # 15 minutes

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  exposed-headers: Authorization
  allow-credentials: true

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    root: INFO
    com.cloudmeet.jitsimgr: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
