# Development Profile
spring:
  datasource:
    url: jdbc:h2:mem:jitsi_mgr
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.cloudmeet.jitsimgr: DEBUG
    org.springframework.security: DEBUG
